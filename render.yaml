services:
  - type: web
    name: hotel-booking-system
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: USER
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
